<!DOCTYPE html>
<html>
<head>
    <title>Photo Details Viewer - Fixed</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <script src="https://cdn.jsdelivr.net/npm/exifreader@4.0.0/dist/exif-reader.min.js"></script>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            padding: 20px;
            line-height: 1.6;
        }
        #preview {
            max-width: 100%;
            height: auto;
            margin: 20px 0;
            border-radius: 10px;
        }
        .info-card {
            background: #f8f9fa;
            padding: 20px;
            border-radius: 10px;
            margin: 20px 0;
        }
        .info-row {
            margin: 10px 0;
            padding: 10px;
            background: white;
            border-radius: 6px;
        }
        .info-label {
            font-weight: bold;
            color: #2c3e50;
        }
        .error { color: #dc3545; }
        .success { color: #28a745; }
        .debug {
            background: #e9ecef;
            padding: 15px;
            border-radius: 8px;
            margin-top: 20px;
            font-family: monospace;
            font-size: 0.9em;
        }
    </style>
</head>
<body>
    <h2>📸 Photo Details Viewer</h2>
    <p>Upload a photo to see its EXIF data including GPS location.</p>
    
    <input type="file" id="photoUpload" accept="image/*" />
    <img id="preview" style="display:none;" />
    
    <div id="info">
        <div class="info-card">
            <p>No photo selected yet.</p>
        </div>
    </div>

    <script>
        // FIXED GPS CONVERSION FUNCTION
        function convertGPSCoordinate(gpsValue, ref) {
            console.log('Converting GPS value:', gpsValue, 'Ref:', ref);
            
            // Handle different GPS data formats
            if (!gpsValue) {
                console.log('No GPS value provided');
                return null;
            }
            
            // Format 1: Array like [41, 53, 24.48]
            if (Array.isArray(gpsValue) && gpsValue.length >= 3) {
                const degrees = Number(gpsValue[0]) || 0;
                const minutes = Number(gpsValue[1]) || 0;
                const seconds = Number(gpsValue[2]) || 0;
                
                let decimal = degrees + (minutes / 60) + (seconds / 3600);
                
                if (ref === 'S' || ref === 'W') {
                    decimal = -decimal;
                }
                
                console.log(`Converted [${degrees}, ${minutes}, ${seconds}] to ${decimal}`);
                return decimal;
            }
            
            // Format 2: Already a decimal number
            if (typeof gpsValue === 'number') {
                let decimal = gpsValue;
                if (ref === 'S' || ref === 'W') {
                    decimal = -decimal;
                }
                console.log(`Using number directly: ${decimal}`);
                return decimal;
            }
            
            // Format 3: String representation
            if (typeof gpsValue === 'string') {
                try {
                    let decimal = parseFloat(gpsValue);
                    if (!isNaN(decimal)) {
                        if (ref === 'S' || ref === 'W') {
                            decimal = -decimal;
                        }
                        console.log(`Parsed string "${gpsValue}" to ${decimal}`);
                        return decimal;
                    }
                } catch (e) {
                    console.log('Failed to parse string:', e);
                }
            }
            
            console.log('Unknown GPS format:', typeof gpsValue, gpsValue);
            return null;
        }
        
        // MAIN FUNCTION
        document.getElementById('photoUpload').addEventListener('change', async function(event) {
            const file = event.target.files[0];
            if (!file) return;
            
            const preview = document.getElementById('preview');
            const infoDiv = document.getElementById('info');
            
            // Show preview
            const reader = new FileReader();
            reader.onload = function(e) {
                preview.src = e.target.result;
                preview.style.display = 'block';
            };
            reader.readAsDataURL(file);
            
            infoDiv.innerHTML = '<div class="info-card"><p>Reading photo data...</p></div>';
            
            try {
                const tags = await ExifReader.load(file, { includeUnknown: true });
                
                // DEBUG: Log all GPS-related tags
                console.log('=== ALL GPS TAGS ===');
                Object.keys(tags).forEach(key => {
                    if (key.includes('GPS') || key.includes('gps')) {
                        console.log(`${key}:`, tags[key]);
                    }
                });
                
                // Extract GPS data
                const gpsLatitude = tags['GPSLatitude'];
                const gpsLongitude = tags['GPSLongitude'];
                const gpsLatRef = tags['GPSLatitudeRef']?.value?.[0] || 'N';
                const gpsLonRef = tags['GPSLongitudeRef']?.value?.[0] || 'E';
                
                console.log('GPSLatitude raw:', gpsLatitude);
                console.log('GPSLongitude raw:', gpsLongitude);
                
                // Convert coordinates
                let latitude = null;
                let longitude = null;
                let locationText = 'No GPS data found';
                let mapsLink = null;
                
                if (gpsLatitude && gpsLongitude) {
                    // Try to get the value - it could be in .value or .description
                    const latValue = gpsLatitude.value || gpsLatitude.description;
                    const lonValue = gpsLongitude.value || gpsLongitude.description;
                    
                    latitude = convertGPSCoordinate(latValue, gpsLatRef);
                    longitude = convertGPSCoordinate(lonValue, gpsLonRef);
                    
                    if (latitude !== null && longitude !== null) {
                        locationText = `${latitude.toFixed(6)}, ${longitude.toFixed(6)}`;
                        mapsLink = `https://www.google.com/maps?q=${latitude},${longitude}`;
                    } else {
                        locationText = 'GPS data found but could not convert';
                    }
                }
                
                // Extract other data
                const dateTime = tags['DateTimeOriginal']?.description || 
                               tags['DateTime']?.description || 
                               'Not found';
                
                const camera = tags['Model']?.description || 
                             tags['Make']?.description || 
                             'Not found';
                
                // Count GPS tags
                const allTags = Object.keys(tags);
                const gpsTags = allTags.filter(tag => tag.includes('GPS') || tag.includes('gps'));
                
                // Build output
                let html = `
                    <div class="info-card">
                        <h3>Photo Information</h3>
                        
                        <div class="info-row">
                            <div class="info-label">📁 File:</div>
                            <div>${file.name} (${Math.round(file.size/1024)} KB)</div>
                        </div>
                        
                        <div class="info-row">
                            <div class="info-label">📅 Date & Time:</div>
                            <div>${dateTime}</div>
                        </div>
                        
                        <div class="info-row">
                            <div class="info-label">📷 Camera:</div>
                            <div>${camera}</div>
                        </div>
                        
                        <div class="info-row">
                            <div class="info-label">📍 Location:</div>
                            <div class="${latitude ? 'success' : 'error'}">
                                ${locationText}
                                ${mapsLink ? `<br><a href="${mapsLink}" target="_blank">View on Google Maps</a>` : ''}
                            </div>
                        </div>`;
                
                // Add debug info
                html += `
                        <div class="debug">
                            <h4>Debug Information:</h4>
                            <p><strong>EXIF tags found:</strong> ${allTags.length}</p>
                            <p><strong>GPS tags found:</strong> ${gpsTags.length}</p>
                            <p><strong>GPS tag names:</strong> ${gpsTags.join(', ')}</p>
                            
                            <p><strong>GPSLatitude value:</strong> ${JSON.stringify(gpsLatitude?.value)}</p>
                            <p><strong>GPSLongitude value:</strong> ${JSON.stringify(gpsLongitude?.value)}</p>
                            <p><strong>GPSLatitude description:</strong> ${gpsLatitude?.description || 'N/A'}</p>
                            <p><strong>GPSLongitude description:</strong> ${gpsLongitude?.description || 'N/A'}</p>
                            
                            <p><strong>Check browser console (F12) for full EXIF data</strong></p>
                        </div>
                    </div>`;
                
                infoDiv.innerHTML = html;
                
            } catch (error) {
                console.error('Error:', error);
                infoDiv.innerHTML = `
                    <div class="info-card">
                        <h3 class="error">Error Reading Photo</h3>
                        <p>${error.message}</p>
                        <p>Check the browser console (F12) for more details.</p>
                    </div>`;
            }
        });
    </script>
</body>
</html>
