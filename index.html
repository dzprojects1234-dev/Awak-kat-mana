<script>
    document.getElementById('photoUpload').addEventListener('change', async function(event) {
        const file = event.target.files[0];
        if (!file) return;

        // Show image preview
        const preview = document.getElementById('preview');
        const reader = new FileReader();
        reader.onload = function(e) {
            preview.src = e.target.result;
            preview.style.display = 'block';
        };
        reader.readAsDataURL(file);

        const infoDiv = document.getElementById('info');
        infoDiv.innerHTML = `<p>Reading data...</p>`;

        try {
            const tags = await ExifReader.load(file, { includeUnknown: true });

            // Log ALL available tags to the browser's console for inspection
            console.log("All EXIF tags found:", tags);

            // Extract and display key details with better error handling
            const dateTime = tags['DateTimeOriginal']?.description || 'Not Found in EXIF';
            
            // GPS Data Extraction
            let locationText = 'No GPS data found';
            if (tags['GPSLatitude'] && tags['GPSLongitude']) {
                const lat = tags['GPSLatitude'].description;
                const lon = tags['GPSLongitude'].description;
                locationText = `${lat}, ${lon}`;
                
                // Also try to read the raw values (different format)
                console.log("GPSLatitude (raw):", tags['GPSLatitude'].value);
                console.log("GPSLongitude (raw):", tags['GPSLongitude'].value);
            } else {
                console.warn("GPSLatitude or GPSLongitude tag is missing.");
                // List what GPS-related tags ARE present
                const gpsTags = Object.keys(tags).filter(key => key.includes('GPS'));
                console.log("Available GPS-related tags:", gpsTags);
            }

            infoDiv.innerHTML = `
                <div class="detail-item"><span class="detail-label">Date & Time:</span> ${dateTime}</div>
                <div class="detail-item"><span class="detail-label">Location (GPS):</span> ${locationText}</div>
                <div class="detail-label">Debug Info:</span> Check browser console (F12) for full EXIF data.</div>
            `;

        } catch (error) {
            console.error("Error reading EXIF data:", error);
            infoDiv.innerHTML = `<p>Error reading file. The file might be corrupted or not a JPEG.</p>`;
        }
    });
</script>
