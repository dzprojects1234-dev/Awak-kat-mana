<!DOCTYPE html>
<html>
<head>
    <title>GPS Data Inspector</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <script src="https://cdn.jsdelivr.net/npm/exifreader@4.0.0/dist/exif-reader.min.js"></script>
    <style>
        body { font-family: Arial, sans-serif; padding: 20px; }
        .test-box { 
            background: #f0f8ff; 
            padding: 20px; 
            border: 2px solid #4CAF50;
            border-radius: 10px;
            margin: 20px 0;
        }
        .result { 
            background: #fff3cd; 
            padding: 15px; 
            margin: 15px 0;
            border-left: 4px solid #ffc107;
        }
        .zero-data { 
            background: #f8d7da; 
            color: #721c24;
            padding: 10px;
            margin: 10px 0;
            border-radius: 5px;
        }
        .coordinates { 
            font-family: monospace; 
            background: #333; 
            color: white; 
            padding: 10px; 
            margin: 10px 0;
        }
    </style>
</head>
<body>
    <h2>🔍 GPS Data Inspector</h2>
    <p>This tool will show you what's really in your photo's GPS data.</p>
    
    <input type="file" id="fileInput" accept="image/*">
    
    <div id="results"></div>

    <script>
        document.getElementById('fileInput').addEventListener('change', async function(event) {
            const file = event.target.files[0];
            if (!file) return;
            
            const resultsDiv = document.getElementById('results');
            resultsDiv.innerHTML = '<div class="test-box">Reading photo data...</div>';
            
            try {
                const tags = await ExifReader.load(file);
                
                // Get ALL GPS-related data
                const gpsTags = {};
                Object.keys(tags).forEach(key => {
                    if (key.includes('GPS') || key.includes('gps')) {
                        gpsTags[key] = tags[key];
                    }
                });
                
                // Your known coordinates for comparison
                const knownLat = 1.373782;
                const knownLon = 103.741952;
                
                // Check if GPS data is all zeros
                const gpsLat = tags['GPSLatitude'];
                const gpsLon = tags['GPSLongitude'];
                
                let isZeroData = false;
                if (gpsLat && gpsLat.value && gpsLon && gpsLon.value) {
                    // Check if all values are zero
                    const allZero = gpsLat.value.flat().every(v => v === 0) && 
                                   gpsLon.value.flat().every(v => v === 0);
                    isZeroData = allZero;
                }
                
                // Build results
                let html = '<div class="test-box">';
                html += '<h3>📊 Analysis Results</h3>';
                
                html += '<div class="coordinates">';
                html += '<strong>Your known coordinates:</strong><br>';
                html += `Latitude: ${knownLat}<br>`;
                html += `Longitude: ${knownLon}`;
                html += '</div>';
                
                if (isZeroData) {
                    html += '<div class="zero-data">';
                    html += '<strong>⚠️ PROBLEM DETECTED:</strong><br>';
                    html += 'Your photo\'s GPS data contains ALL ZEROS: [[0,0],[0,0],[0,0]]<br>';
                    html += 'This means the actual coordinates have been removed or corrupted.';
                    html += '</div>';
                }
                
                html += '<div class="result">';
                html += '<strong>📋 GPS Data Found:</strong><br>';
                html += `Total GPS tags: ${Object.keys(gpsTags).length}<br>`;
                
                // Show all GPS tags
                Object.keys(gpsTags).forEach(tagName => {
                    const tag = gpsTags[tagName];
                    html += `<br><strong>${tagName}:</strong> `;
                    
                    if (tag.value && Array.isArray(tag.value)) {
                        html += `Value: ${JSON.stringify(tag.value)}<br>`;
                    }
                    if (tag.description) {
                        html += `Description: ${tag.description}<br>`;
                    }
                });
                
                html += '</div>';
                
                html += '<div class="result">';
                html += '<strong>🔧 What This Means:</strong><br>';
                html += '1. Your photo originally had GPS: 1.373782, 103.741952<br>';
                html += '2. Something removed or corrupted the GPS data<br>';
                html += '3. Now it shows all zeros instead of the real coordinates<br><br>';
                html += '<strong>Possible causes:</strong><br>';
                html += '✓ Photo edited in social media app (Facebook, WhatsApp, Instagram)<br>';
                html += '✓ Photo transferred via messaging app<br>';
                html += '✓ Privacy setting that strips location data<br>';
                html += '✓ Corrupted file during transfer';
                html += '</div>';
                
                html += '<div class="result">';
                html += '<strong>🛠️ How to Fix:</strong><br>';
                html += '1. Find the ORIGINAL photo from your phone\'s Camera folder<br>';
                html += '2. Don\'t use photos from social/media apps<br>';
                html += '3. Make sure location services are ON in camera settings<br>';
                html += '4. Try a brand new photo taken right now';
                html += '</div>';
                
                html += '</div>';
                
                resultsDiv.innerHTML = html;
                
                // Log to console for detailed analysis
                console.log('=== DETAILED GPS ANALYSIS ===');
                console.log('Known coordinates should be:', knownLat, knownLon);
                console.log('Actual GPS data found:', {
                    GPSLatitude: gpsLat?.value,
                    GPSLongitude: gpsLon?.value,
                    GPSLatitudeRef: tags['GPSLatitudeRef']?.value,
                    GPSLongitudeRef: tags['GPSLongitudeRef']?.value
                });
                
            } catch (error) {
                resultsDiv.innerHTML = `<div class="zero-data">Error: ${error.message}</div>`;
            }
        });
    </script>
</body>
</html>
