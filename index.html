<!DOCTYPE html>
<html>
<head>
    <title>Simple Photo GPS Table</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <style>
        body {
            font-family: Arial, sans-serif;
            padding: 20px;
            max-width: 800px;
            margin: 0 auto;
        }
        table {
            width: 100%;
            border-collapse: collapse;
            margin: 20px 0;
        }
        th, td {
            border: 1px solid #ddd;
            padding: 10px;
            text-align: left;
        }
        th {
            background-color: #4CAF50;
            color: white;
        }
        .zeroed {
            color: red;
            font-weight: bold;
        }
        .manual-entry {
            background: #f9f9f9;
            padding: 15px;
            border: 1px solid #ddd;
            margin: 20px 0;
        }
        input {
            padding: 8px;
            margin: 5px;
            width: 200px;
        }
        button {
            padding: 8px 15px;
            background: #4CAF50;
            color: white;
            border: none;
            cursor: pointer;
        }
    </style>
</head>
<body>
    <h2>📷 Photo Location Table</h2>
    
    <!-- File Upload -->
    <input type="file" id="photoUpload" accept="image/*">
    
    <!-- Manual Entry for Zeroed Photos -->
    <div class="manual-entry">
        <h3>For Photos with Zeroed GPS (like your example):</h3>
        <p><strong>Your known coordinates:</strong> 1.373782, 103.741952</p>
        <input type="text" id="manualLat" placeholder="Enter Latitude (e.g., 1.373782)">
        <input type="text" id="manualLon" placeholder="Enter Longitude (e.g., 103.741952)">
        <button onclick="addManualEntry()">Add to Table</button>
    </div>
    
    <!-- The Table -->
    <table id="locationTable">
        <thead>
            <tr>
                <th>#</th>
                <th>Filename</th>
                <th>Date/Time</th>
                <th>Latitude</th>
                <th>Longitude</th>
                <th>GPS Status</th>
                <th>Map</th>
            </tr>
        </thead>
        <tbody id="tableBody">
            <!-- Data will appear here -->
        </tbody>
    </table>

    <script>
        let photoCounter = 1;
        
        // Handle photo upload
        document.getElementById('photoUpload').addEventListener('change', function(event) {
            const file = event.target.files[0];
            if (!file) return;
            
            // Get current date/time (since GPS is zeroed)
            const now = new Date();
            const dateTime = now.toLocaleString();
            
            // Add to table
            addToTable(
                file.name,
                dateTime,
                'N/A',
                'N/A',
                'Zeroed Out',
                '#'
            );
        });
        
        // Add manual entry
        function addManualEntry() {
            const lat = document.getElementById('manualLat').value || '1.373782';
            const lon = document.getElementById('manualLon').value || '103.741952';
            
            addToTable(
                '1000078586.jpg',
                '2025:12:18 13:24:49',
                lat,
                lon,
                'Manual Entry ✓',
                `https://www.google.com/maps?q=${lat},${lon}`
            );
            
            // Clear inputs
            document.getElementById('manualLat').value = '';
            document.getElementById('manualLon').value = '';
        }
        
        // Function to add row to table
        function addToTable(filename, dateTime, lat, lon, status, mapLink) {
            const tableBody = document.getElementById('tableBody');
            
            const row = document.createElement('tr');
            row.innerHTML = `
                <td>${photoCounter++}</td>
                <td>${filename}</td>
                <td>${dateTime}</td>
                <td>${lat}</td>
                <td>${lon}</td>
                <td class="${status.includes('Zeroed') ? 'zeroed' : ''}">${status}</td>
                <td>${mapLink !== '#' ? `<a href="${mapLink}" target="_blank">View Map</a>` : 'N/A'}</td>
            `;
            
            tableBody.appendChild(row);
        }
        
        // Add your example data to start
        window.onload = function() {
            addToTable(
                '1000078586.jpg',
                '2025:12:18 13:24:49',
                'N/A',
                'N/A',
                'Zeroed Out',
                '#'
            );
        };
    </script>
</body>
</html>
