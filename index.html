<!DOCTYPE html>
<html>
<head>
    <title>Photo Details Viewer</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <!-- Link to the ExifReader library -->
    <script src="https://cdn.jsdelivr.net/npm/exifreader@4.0.0/dist/exif-reader.min.js"></script>
    <style>
        body {
            font-family: sans-serif;
            padding: 20px;
            line-height: 1.6;
        }
        #preview {
            max-width: 100%;
            height: auto;
            margin: 15px 0;
            border-radius: 8px;
            border: 1px solid #ddd;
        }
        #info {
            background-color: #f8f9fa;
            padding: 15px;
            border-radius: 8px;
            margin-top: 15px;
        }
        .detail-item {
            margin-bottom: 10px;
            padding: 8px;
            background: white;
            border-radius: 5px;
        }
        .detail-label {
            font-weight: bold;
            color: #2c3e50;
            display: inline-block;
            width: 140px;
        }
        .debug {
            background-color: #fff3cd;
            border-left: 4px solid #ffc107;
            padding: 12px;
            margin-top: 15px;
            font-family: monospace;
            font-size: 0.9em;
        }
        .error {
            color: #dc3545;
            font-weight: bold;
        }
        .success {
            color: #198754;
            font-weight: bold;
        }
    </style>
</head>
<body>
    <h2>📸 Photo Details Viewer (Debug Version)</h2>
    <p>Select a photo to see its EXIF data including location, date, and time.</p>

    <!-- File input for photo selection -->
    <input type="file" id="photoUpload" accept="image/*" />
    
    <!-- Image preview area -->
    <img id="preview" style="display:none;" />
    
    <!-- Information display area -->
    <div id="info">
        <p>No photo selected yet. Details will appear here.</p>
    </div>
    
    <!-- Debug information area -->
    <div id="debugInfo" class="debug" style="display:none;">
        <h4>Debug Information:</h4>
        <div id="debugContent"></div>
    </div>

    <script>
        document.getElementById('photoUpload').addEventListener('change', async function(event) {
            const file = event.target.files[0];
            if (!file) return;

            // Get DOM elements
            const preview = document.getElementById('preview');
            const infoDiv = document.getElementById('info');
            const debugDiv = document.getElementById('debugInfo');
            const debugContent = document.getElementById('debugContent');
            
            // Clear previous content
            infoDiv.innerHTML = '<p>Reading photo data...</p>';
            debugContent.innerHTML = '';
            debugDiv.style.display = 'none';

            // Step 1: Display image preview
            const reader = new FileReader();
            reader.onload = function(e) {
                preview.src = e.target.result;
                preview.style.display = 'block';
            };
            reader.readAsDataURL(file);

            // Step 2: Read EXIF data with better error handling
            try {
                // Load EXIF data including unknown tags
                const tags = await ExifReader.load(file, { 
                    includeUnknown: true 
                });
                
                console.log('All EXIF tags loaded:', tags);
                
                // Step 3: Extract specific information
                // Date and time
                const dateTime = tags['DateTimeOriginal']?.description || 
                               tags['DateTime']?.description || 
                               tags['DateTimeDigitized']?.description || 
                               'Not found';
                
                // Camera model
                const cameraModel = tags['Model']?.description || 
                                  tags['Make']?.description + ' ' + tags['Model']?.description || 
                                  'Not found';
                
                // Step 4: Extract GPS data - TRY MULTIPLE METHODS
                let locationText = 'No GPS data found';
                let latitude = null;
                let longitude = null;
                
                // METHOD 1: Standard GPS tags (most common)
                if (tags['GPSLatitude'] && tags['GPSLongitude']) {
                    latitude = tags['GPSLatitude'].description;
                    longitude = tags['GPSLongitude'].description;
                    
                    // Check if we have reference tags (N/S, E/W)
                    const latRef = tags['GPSLatitudeRef']?.value?.[0] || 'N';
                    const lonRef = tags['GPSLongitudeRef']?.value?.[0] || 'E';
                    
                    locationText = `${latitude} ${latRef}, ${longitude} ${lonRef}`;
                }
                
                // METHOD 2: Check if GPS data exists but in different format
                if (locationText === 'No GPS data found') {
                    // Look for ANY GPS-related tags
                    const gpsTags = {};
                    for (const key in tags) {
                        if (key.includes('GPS') || key.includes('gps')) {
                            gpsTags[key] = tags[key];
                        }
                    }
                    
                    if (Object.keys(gpsTags).length > 0) {
                        locationText = 'GPS tags found but in non-standard format';
                        console.log('Non-standard GPS tags:', gpsTags);
                    }
                }
                
                // Step 5: Display the information
                infoDiv.innerHTML = `
                    <div class="detail-item">
                        <span class="detail-label">📅 Date & Time:</span> 
                        <span class="${dateTime !== 'Not found' ? 'success' : 'error'}">${dateTime}</span>
                    </div>
                    <div class="detail-item">
                        <span class="detail-label">📍 Location:</span> 
                        <span class="${locationText !== 'No GPS data found' ? 'success' : 'error'}">${locationText}</span>
                    </div>
                    <div class="detail-item">
                        <span class="detail-label">📷 Camera:</span> ${cameraModel}
                    </div>
                `;
                
                // Step 6: Show debug information
                debugDiv.style.display = 'block';
                
                // Count available EXIF tags
                const tagCount = Object.keys(tags).length;
                
                // Check specifically for GPS tags
                const gpsTagNames = Object.keys(tags).filter(key => 
                    key.includes('GPS') || key.includes('gps')
                );
                
                debugContent.innerHTML = `
                    <p><strong>File:</strong> ${file.name} (${Math.round(file.size/1024)} KB)</p>
                    <p><strong>EXIF tags found:</strong> ${tagCount}</p>
                    <p><strong>GPS-related tags:</strong> ${gpsTagNames.length > 0 ? gpsTagNames.join(', ') : 'None'}</p>
                    <p><strong>Tip:</strong> If location shows "GPS tags found but in non-standard format", 
                    your phone stores GPS data in a way that needs special parsing. Open browser console (F12) 
                    to see all tags for manual inspection.</p>
                `;
                
                // Log important GPS tags to console for detailed inspection
                if (gpsTagNames.length > 0) {
                    console.log('--- GPS TAG DETAILS ---');
                    gpsTagNames.forEach(tagName => {
                        console.log(`${tagName}:`, tags[tagName]);
                    });
                }
                
            } catch (error) {
                console.error('Error reading EXIF data:', error);
                infoDiv.innerHTML = `
                    <p class="error">❌ Error reading photo data</p>
                    <p>Possible reasons:</p>
                    <ul>
                        <li>Photo has no EXIF data (edited in social media app)</li>
                        <li>File format not supported (try JPEG)</li>
                        <li>File is corrupted</li>
                    </ul>
                `;
            }
        });
    </script>
</body>
</html>
