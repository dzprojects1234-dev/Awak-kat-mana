<!DOCTYPE html>
<html>
<head>
    <title>Photo GPS Viewer - Fixed Rational Numbers</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <script src="https://cdn.jsdelivr.net/npm/exifreader@4.0.0/dist/exif-reader.min.js"></script>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            padding: 20px;
            line-height: 1.6;
        }
        #preview {
            max-width: 100%;
            height: auto;
            margin: 20px 0;
            border-radius: 10px;
        }
        .info-card {
            background: #f8f9fa;
            padding: 20px;
            border-radius: 10px;
            margin: 20px 0;
        }
        .info-row {
            margin: 10px 0;
            padding: 10px;
            background: white;
            border-radius: 6px;
        }
        .info-label {
            font-weight: bold;
            color: #2c3e50;
            width: 120px;
            display: inline-block;
        }
        .success { color: #28a745; font-weight: bold; }
        .error { color: #dc3545; }
        .debug {
            background: #e9ecef;
            padding: 15px;
            border-radius: 8px;
            margin-top: 20px;
            font-family: monospace;
            font-size: 0.9em;
        }
        .maps-btn {
            display: inline-block;
            background: #4285f4;
            color: white;
            padding: 8px 16px;
            border-radius: 5px;
            text-decoration: none;
            margin-top: 10px;
            font-weight: 500;
        }
    </style>
</head>
<body>
    <h2>📸 Photo GPS Viewer</h2>
    <p>Upload a photo to see its GPS location (now with rational number support).</p>
    
    <input type="file" id="photoUpload" accept="image/*" />
    <img id="preview" style="display:none;" />
    
    <div id="info">
        <div class="info-card">
            <p>No photo selected yet.</p>
        </div>
    </div>

    <script>
        // FIXED: CONVERT RATIONAL NUMBER GPS FORMAT
        // Your GPS data is in format: [[numerator1, denominator1], [numerator2, denominator2], [numerator3, denominator3]]
        function convertRationalGPS(rationalArray, ref) {
            console.log('Converting rational GPS:', rationalArray, 'Ref:', ref);
            
            if (!Array.isArray(rationalArray) || rationalArray.length < 3) {
                return null;
            }
            
            let degrees = 0, minutes = 0, seconds = 0;
            
            // Parse degrees (first array element)
            if (Array.isArray(rationalArray[0]) && rationalArray[0].length >= 2) {
                const [num, den] = rationalArray[0];
                degrees = den !== 0 ? num / den : 0;
            }
            
            // Parse minutes (second array element)
            if (Array.isArray(rationalArray[1]) && rationalArray[1].length >= 2) {
                const [num, den] = rationalArray[1];
                minutes = den !== 0 ? num / den : 0;
            }
            
            // Parse seconds (third array element)
            if (Array.isArray(rationalArray[2]) && rationalArray[2].length >= 2) {
                const [num, den] = rationalArray[2];
                seconds = den !== 0 ? num / den : 0;
            }
            
            console.log(`Parsed: ${degrees}°, ${minutes}', ${seconds}"`);
            
            let decimal = degrees + (minutes / 60) + (seconds / 3600);
            
            if (ref === 'S' || ref === 'W') {
                decimal = -decimal;
            }
            
            return decimal;
        }
        
        // MAIN FUNCTION
        document.getElementById('photoUpload').addEventListener('change', async function(event) {
            const file = event.target.files[0];
            if (!file) return;
            
            const preview = document.getElementById('preview');
            const infoDiv = document.getElementById('info');
            
            // Show preview
            const reader = new FileReader();
            reader.onload = function(e) {
                preview.src = e.target.result;
                preview.style.display = 'block';
            };
            reader.readAsDataURL(file);
            
            infoDiv.innerHTML = '<div class="info-card"><p>Reading photo data...</p></div>';
            
            try {
                const tags = await ExifReader.load(file, { includeUnknown: true });
                
                // Log GPS data for debugging
                console.log('=== GPS DATA ===');
                console.log('GPSLatitude:', tags['GPSLatitude']);
                console.log('GPSLongitude:', tags['GPSLongitude']);
                console.log('GPSLatitudeRef:', tags['GPSLatitudeRef']);
                console.log('GPSLongitudeRef:', tags['GPSLongitudeRef']);
                
                // Extract GPS data
                const gpsLatitude = tags['GPSLatitude'];
                const gpsLongitude = tags['GPSLongitude'];
                const gpsLatRef = tags['GPSLatitudeRef']?.value?.[0] || 'N';
                const gpsLonRef = tags['GPSLongitudeRef']?.value?.[0] || 'E';
                
                // Convert coordinates using rational number parser
                let latitude = null;
                let longitude = null;
                let locationText = 'No GPS data found';
                let mapsLink = null;
                
                if (gpsLatitude && gpsLongitude && gpsLatitude.value && gpsLongitude.value) {
                    latitude = convertRationalGPS(gpsLatitude.value, gpsLatRef);
                    longitude = convertRationalGPS(gpsLongitude.value, gpsLonRef);
                    
                    if (latitude !== null && longitude !== null) {
                        locationText = `${latitude.toFixed(6)}, ${longitude.toFixed(6)}`;
                        mapsLink = `https://www.google.com/maps?q=${latitude},${longitude}`;
                    }
                }
                
                // Try alternative method if first fails
                if ((latitude === null || longitude === null) && gpsLatitude && gpsLongitude) {
                    console.log('Trying alternative GPS parsing...');
                    
                    // Sometimes the data is in the description field
                    if (gpsLatitude.description && gpsLongitude.description) {
                        const latMatch = gpsLatitude.description.match(/[\d\.]+/g);
                        const lonMatch = gpsLongitude.description.match(/[\d\.]+/g);
                        
                        if (latMatch && latMatch.length >= 3) {
                            const deg = parseFloat(latMatch[0]) || 0;
                            const min = parseFloat(latMatch[1]) || 0;
                            const sec = parseFloat(latMatch[2]) || 0;
                            latitude = deg + (min / 60) + (sec / 3600);
                            if (gpsLatRef === 'S') latitude = -latitude;
                        }
                        
                        if (lonMatch && lonMatch.length >= 3) {
                            const deg = parseFloat(lonMatch[0]) || 0;
                            const min = parseFloat(lonMatch[1]) || 0;
                            const sec = parseFloat(lonMatch[2]) || 0;
                            longitude = deg + (min / 60) + (sec / 3600);
                            if (gpsLonRef === 'W') longitude = -longitude;
                        }
                        
                        if (latitude !== null && longitude !== null) {
                            locationText = `${latitude.toFixed(6)}, ${longitude.toFixed(6)}`;
                            mapsLink = `https://www.google.com/maps?q=${latitude},${longitude}`;
                        }
                    }
                }
                
                // Extract other data
                const dateTime = tags['DateTimeOriginal']?.description || 
                               tags['DateTime']?.description || 
                               'Not found';
                
                const camera = tags['Model']?.description || 
                             tags['Make']?.description || 
                             'Not found';
                
                // Build output
                let html = `
                    <div class="info-card">
                        <h3>Photo Information</h3>
                        
                        <div class="info-row">
                            <span class="info-label">📁 File:</span>
                            ${file.name} (${Math.round(file.size/1024)} KB)
                        </div>
                        
                        <div class="info-row">
                            <span class="info-label">📅 Date & Time:</span>
                            ${dateTime}
                        </div>
                        
                        <div class="info-row">
                            <span class="info-label">📷 Camera:</span>
                            ${camera}
                        </div>
                        
                        <div class="info-row">
                            <span class="info-label">📍 Location:</span>
                            <div class="${latitude ? 'success' : 'error'}">
                                ${locationText}
                                ${mapsLink ? `<br><a href="${mapsLink}" target="_blank" class="maps-btn">🗺️ View on Google Maps</a>` : ''}
                            </div>
                        </div>
                        
                        <div class="debug">
                            <h4>Debug Information:</h4>
                            <p><strong>EXIF tags found:</strong> ${Object.keys(tags).length}</p>
                            <p><strong>GPS tags found:</strong> ${Object.keys(tags).filter(tag => tag.includes('GPS')).length}</p>
                            <p><strong>GPSLatitude value:</strong> ${JSON.stringify(gpsLatitude?.value)}</p>
                            <p><strong>GPSLongitude value:</strong> ${JSON.stringify(gpsLongitude?.value)}</p>
                            <p><strong>Latitude Ref:</strong> ${gpsLatRef}</p>
                            <p><strong>Longitude Ref:</strong> ${gpsLonRef}</p>
                            <p><strong>Expected coordinates:</strong> ~1.373782, 103.741952</p>
                        </div>
                    </div>`;
                
                infoDiv.innerHTML = html;
                
                // Manual calculation based on your coordinates
                console.log('\n=== MANUAL CALCULATION ===');
                console.log('Your coordinates: 1.373782, 103.741952');
                console.log('This means:');
                console.log('Latitude: 1° 22' 25.6152" N');
                console.log('Longitude: 103° 44' 31.0272" E');
                console.log('\nSo your GPS arrays should be approximately:');
                console.log('GPSLatitude: [[1,1], [22,1], [256152,10000]]');
                console.log('GPSLongitude: [[103,1], [44,1], [310272,10000]]');
                
            } catch (error) {
                console.error('Error:', error);
                infoDiv.innerHTML = `
                    <div class="info-card">
                        <h3 class="error">Error Reading Photo</h3>
                        <p>${error.message}</p>
                    </div>`;
            }
        });
    </script>
</body>
</html>
